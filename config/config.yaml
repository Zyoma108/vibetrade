exchanges:
  binance:
    enabled: true
  bybit:
    enabled: true
    api_key: "${BYBIT_API_KEY}"
    secret: "${BYBIT_SECRET}"

collectors:
  interval_seconds: 15
  timeframe: 3m                  # таймфрейм свечей (1m, 5m, 15m, 1h)

strategy:
  min_volume_usdt: 1000000       # минимальный суточный объём в USDT
  exclude_coins:                 # монеты, исключаемые из сканирования (без /USDT)
    - BTC
    - ETH
    - BNB
    - SOL
    - XRP
    # Скамные монеты, которые часто дают ложные сигналы из-за низкой ликвидности
    - HBAR
    - EWY
    - DEXE
    - HOLO
    - WHITEWHALE
    # US-токены — требуют ByBit agreement, не сканируем
    - META
    - AMAT
    - KLAC
    - AAPL
    - AXTI
    - BE
    - COIN
    - DELL
    - DRAM
    - GOOGL
    - HOOD
    - LITE
    - MSTR
    - NBIS
    - RKLB
    - SKHY
    - SNXX
    - SPCX
    - SHAZ
    - TSLA
    - CBRS
    - IBM
    - INTC
    - KORU
    - MSFT
    - MU
    - MVLL
    - ORCL
    - SNDK
    - SOXL
    - TQQQ
    - SOXS
    - AAOI
    - ARM
    - MUU
    - BSP
    - PLTR
    - IREN
    - SAMSUNG                     # токенизированная акция — отдельное соглашение (bybit_agreement, 11.08.2026)
    - CL                          # нефтяной фьючерс — отдельное соглашение (Crude Oil Trading Terms)
    - SKHYNIX                     # токенизированная акция (SK Hynix) — bybit_agreement, 19.08.2026
    - ZHIPU                       # токенизированная акция — bybit_agreement, 19.08.2026 (3 повторных сигнала до бана)
    - SMCI                        # токенизированная акция (Super Micro) — bybit_agreement, 19.08.2026
    - MRVL                        # токенизированная акция (Marvell) — bybit_agreement, 19.08.2026
    - COHR                        # токенизированная акция (Coherent) — bybit_agreement, 19.08.2026
    - QNTX                        # токенизированная акция (Quantinuum) — bybit_agreement, 19.08.2026
    - CRCL                        # токенизированная акция (Circle) — bybit_agreement, 01.09.2026
    - NVDA                        # токенизированная акция (NVIDIA) — bybit_agreement, 01.09.2026
    - XAG                         # серебро — отдельное соглашение (Trading Terms, retCode 110123),
                                  # 01.09.2026. На этой тройке ушло 10 сигналов из 44 за 27.08-01.09
  baseline_bars: 70              # свечей для расчёта нормального объёма
  volume_surge_mult: 5.0         # во сколько раз объём должен превысить норму
  min_baseline_volume_usdt: 25000 # мин. медиана объёма бара в USDT, 0 = выкл. 5000 -> 25000
                                  # (аудит 25.08.2026): мат. ожидание по децилям ликвидности
                                  # растёт монотонно, на пороге 25k +0.272R против +0.146R без
                                  # него, и это единственное изменение, которое вытягивает
                                  # первую (слабую) неделю из минуса. Тонкие монеты дают
                                  # широкий спред, накрученный объём и рагпулы.
  sustain_bars: 4                # сколько свечей подряд выше порога для сигнала
  oi_filter_enabled: false       # OI-гейт (oi_declining + oi_slope_min_pct) ВЫКЛЮЧЕН 25.08.2026.
                                 # Аудит 15 дней / 5540 кандидатов: блок net-вреден и был главным
                                 # источником убыточности. OI пишется раз в цикл скана, поэтому
                                 # OI_TREND_BARS=3 — это не фиксированное окно, а 4-10 минут в
                                 # зависимости от скорости скана (замерено: ~280с/сэмпл до
                                 # 19.08, ~110с после). Требование "+2% OI за этот срок"
                                 # механически отбирает уже перегретые сетапы: у прошедших гейт
                                 # медианный размах sustain-окна 4.05% против 1.65% у остальных,
                                 # pump-от-baseline 6.34% против 2.0%, TP 16.8% против 22-24%,
                                 # SL 36.1% против 24%. То есть гейт работал ПРОТИВ
                                 # exhaustion/retracement-фильтров и выигрывал у них.
                                 # Выключение: мат. ожидание -0.089R -> +0.146R, сигналов 180 -> 600.
                                 # OI продолжает собираться в БД — выключен только гейт.
  oi_slope_min_pct: 2.0          # активен только при oi_filter_enabled: true
  max_window_range_pct: 4.0      # макс. размах (high/low-1) sustain-окна, % (0 = выкл). Введён
                                 # 25.08.2026. Сильнейший одиночный предиктор исхода в аудите:
                                 # стоп фиксирован (stop_loss_pct=5), поэтому у монеты с размахом
                                 # 4-7% за 12 минут он стоит внутри обычного шума и выбивается
                                 # почти гарантированно. По децилям монотонно: размах >4% даёт
                                 # -0.145R, <=2.5% даёт +0.26R. Сетка 7x7 (порог x ликвидность)
                                 # монотонна в обе стороны без пиков — 4.0 взят по максимуму
                                 # R/день портфеля (2.88 против 2.05 без фильтра), плато
                                 # 3.0-5.0 даёт 2.15-2.88. Walk-forward в обе стороны:
                                 # подбор на одной неделе -> эффект сохраняется на другой.
  smooth_max_ratio: 5.0           # макс. отношение макс/медиана объёма (отсекает спайки)
  dump_volume_mult: 0.0           # защита от свечей-выбросов (0 = выкл)
  price_growth_min_pct: 1.0      # минимальный рост цены за sustain-окно, %
  price_growth_max_pct: 12.0     # страховочный потолок роста цены, 0 = выкл
  exhaustion_gain_pct: 5.0       # порог роста для exhaustion-фильтра
  exhaustion_pos_ratio: 0.7      # позиция закрытия свечи (0=low, 1=high)
  exhaustion_extreme_pct: 10.0   # порог экстремального пампа от медианы baseline, %. Был
                                 # захардкожен как exhaustion_gain_pct*6 = 30% и почти никого
                                 # не отсекал. Аудит 25.08.2026: по децилям pump-от-baseline
                                 # оптимум 1.5-5%, выше 6.8% мат. ожидание уходит в минус.
                                 # 30 -> 10: +0.589R -> +0.702R, обе недели улучшаются.
  max_hourly_drop_pct: 10.0      # макс. падение за час (защита от рагпулов), 0 = выкл
  pre_surge_max_pct: 3.0         # макс. рост за 30 мин до sustain-окна (0 = выкл). 8.0 -> 3.0
                                 # (аудит 25.08.2026): на пороге 8% фильтр ловил единицы. По
                                 # децилям pre_pump оптимум 0.03-1.65%, выше 2.76% мат. ожидание
                                 # ~0. Вместе с exhaustion_extreme_pct даёт +0.737R против
                                 # +0.589R, а на слабой первой неделе +0.403R против +0.236R —
                                 # именно там, где бот systematically терял.
  max_window_retracement_pct: 0.0 # макс. откат от пика sustain-окна к моменту сигнала, 0 = выкл. Live-эксперимент с 10.08.2026 (th=2.0) ДОСРОЧНО ОТКАЧЕН 20.08.2026: ре-верификация свипа на движке с фиксом oi_declining (commit 6179449) показала th=2.0 хуже baseline на архивной БД (ближайшая честная репродукция исходного окна) и оптимум сместился на th=1.0 на новой БД — прямо противоречит прежнему обоснованию. См. AGENTS.md и память retracement-filter-live-experiment
  cautious_volume_surge_mult_increase_pct: 50.0  # +50% к volume_surge_mult в CAUTIOUS режиме

strategy_price_surge:                    # детектор пампов по чистой цене (только сигналы)
  price_surge_pct: 5.0           # рост цены в % для сигнала
  price_surge_minutes: 18        # промежуток времени в минутах

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_ids:
    - "${TELEGRAM_CHAT_ID}"

telegram_price_surge:                    # отдельный бот для strategy_price_surge
  bot_token: "${TELEGRAM_PRICE_SURGE_BOT_TOKEN}"
  chat_ids:
    - "${TELEGRAM_PRICE_SURGE_CHAT_ID}"

market_context:
  enabled: true                   # включить рыночный контекст
  btc_drop_threshold_pct: 1.5     # порог падения BTC за час для cautious/risk-off, %
  trend_threshold_pct: 1.0        # порог изменения цены за 4ч для определения тренда, %
  supertrend_atr_period: 10       # период ATR для Supertrend
  supertrend_multiplier: 3.0      # множитель ATR для Supertrend

trading:
  mode: real                      # signal | real
  exchange: bybit                 # биржа для торговли
  max_positions: 10               # максимум одновременных позиций
  leverage: 10                    # кредитное плечо
  risk_per_trade_pct: 1         # % от депозита, которым рискуем за один стоп
  risk_reward_ratio: 2.0          # соотношение TP/SL (2.0 = 1:2 risk/reward, TP=+10%)
  stop_loss_pct: 5.0              # стоп-лосс, % от цены входа
  max_hold_hours: 72.0            # макс. время удержания, часов. 48 -> 72 (аудит 25.08.2026):
                                  # мат. ожидание монотонно растёт со сроком удержания
                                  # (4ч -0.067R, 12ч -0.025R, 24ч +0.055R, 48ч +0.104R,
                                  # 72ч +0.113R), дальше 96ч выходит на плато. Пампы доезжают
                                  # до +10% дольше, чем предполагал прежний лимит.
  partial_close_pct: 35.0         # % пути до TP для закрытия / перевода в б/у
  partial_close_qty_pct: 30.0     # доля позиции (%), закрываемая по триггеру. Live-эксперимент
                                    # с 12.08.2026 (было 50%, захардкожено): свип на 2 нед. данных
                                    # показал монотонный рост total PnL при снижении доли (5%→+16%,
                                    # 30%→+7-11%, механически объяснимо — БУ-защита не зависит от
                                    # доли). Статистика тонкая (n=39). См. память
                                    # partial-close-qty-sweep-august-2026, пересмотреть вместе с
                                    # retracement-экспериментом ~24-31.08.2026
  cooldown_hours: 1.0             # кулдаун после закрытия позиции
  circuit_breaker_enabled: true    # защита от серий убытков (Circuit Breaker)
  circuit_breaker_loss_streak_reduce: 2  # после N убытков подряд уменьшить размер позиции
  circuit_breaker_reduce_mult_pct: 50.0  # множитель размера позиции при срабатывании, %
  circuit_breaker_loss_streak_stop: 3    # после N убытков подряд полностью остановить
  circuit_breaker_stop_minutes: 60       # на сколько минут остановить торговлю
  taker_fee_pct: 0.055             # комиссия тейкера (market-ордер), % от notional
  maker_fee_pct: 0.02              # комиссия мейкера (лимитный reduce-only ордер), % от notional
  backtest_slippage_pct: 0.05      # допущение на проскальзывание входа в бэктесте, % (0 = выкл).
                                   # 0.3 -> 0.05 (аудит 25.08.2026): 0.3% было ничем не измеренным
                                   # допущением и стоило ~0.08R мат. ожидания на сделку в отчётах
                                   # бэктеста — на тонкой стратегии это разница между "в ноль" и
                                   # "прибыльно". Реальный вход — market-ордер на $10-50 нотионала
                                   # по ликвидному перпу. ВАЖНО: точно измерить пока нельзя —
                                   # trades.signal_price для алго-пути всегда NULL
                                   # (PositionManager заполняет его только в pending-ветке).
                                   # Сначала начать писать signal_price на каждом входе, потом
                                   # выставить сюда фактическую медиану.
  pending_entry_pullback_pct: 0    # выкл — market сразу по сигналу. Аудит июля 2026: даёт обратную
                                    # селекцию — лимитник исполняется именно там, где памп уже
                                    # развернулся, и протухает там, где движение шло дальше.
                                    # Механизм остаётся в коде (PositionManager.open_position →
                                    # _open_pending_entry) на случай пересвипа порога.
  pending_entry_timeout_minutes: 9.0  # актуально только при pending_entry_pullback_pct > 0
